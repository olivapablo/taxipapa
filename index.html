<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1a2e" id="metaThemeColor" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Taxímetro" />
  <meta name="description" content="Calculadora de tarifa con descuento para taxistas" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>Taxímetro</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">

    <header class="header">
      <div class="header-icon">🚕</div>
      <div class="header-text">
        <h1>Taxímetro</h1>
        <p>Calculá tu tarifa al instante</p>
      </div>
      <button class="btn-theme" id="btnTheme" aria-label="Cambiar tema" title="Cambiar tema">
        <span class="theme-icon" id="themeIcon">☀️</span>
      </button>
    </header>

    <main class="main">

      <section class="card input-card">
        <label class="label" for="monto">Monto en tickeadora</label>
        <div class="input-row">
          <div class="input-wrapper">
            <span class="currency">$</span>
            <input
              type="number"
              id="monto"
              inputmode="decimal"
              placeholder="0.00"
              autocomplete="off"
              step="0.01"
              min="0"
            />
          </div>
          <button class="btn-confirm" id="btnConfirm" aria-label="Calcular descuento" title="Calcular descuento">
            ✓
          </button>
        </div>
      </section>

      <section class="card result-card" id="resultCard">
        <div class="result-label">Cobrarle al pasajero</div>
        <div class="result-amount" id="resultAmount">—</div>
        <div class="result-detail" id="resultDetail"></div>
        <button class="btn-copy" id="btnCopy" style="display:none" onclick="copiarMonto()">
          Copiar monto
        </button>
      </section>

      <section class="card info-card">
        <div class="info-row">
          <span class="info-icon">🏷️</span>
          <span>Descuento aplicado: <strong>20%</strong></span>
        </div>
        <div class="info-row">
          <span class="info-icon">⚡</span>
          <span>Ingresá el monto y tocá <strong>✓</strong> para calcular</span>
        </div>
      </section>

      <button class="btn-clear" id="btnClear" onclick="limpiar()">Limpiar campos</button>

      <section class="card history-card" id="historyCard">
        <div class="history-header" id="historyHeader">
          <div class="history-title">
            <span class="history-icon">📋</span>
            <span>Historial de viajes</span>
            <span class="history-badge" id="historyBadge">0</span>
          </div>
          <span class="history-toggle" id="historyToggle">▼</span>
        </div>

        <div class="history-body" id="historyBody">
          <div class="history-summary" id="historySummary" style="display:none">
            <div class="summary-item">
              <span class="summary-label">Viajes hoy</span>
              <span class="summary-value" id="summaryTrips">0</span>
            </div>
            <div class="summary-item">
              <span class="summary-label">Total cobrado</span>
              <span class="summary-value summary-total" id="summaryTotal">$0,00</span>
            </div>
          </div>

          <div class="history-filters" id="historyFilters" style="display:none">
            <div class="filter-pills">
              <button class="filter-pill active" data-filter="hoy">Hoy</button>
              <button class="filter-pill" data-filter="ayer">Ayer</button>
              <button class="filter-pill" data-filter="semana">Semana</button>
              <button class="filter-pill" data-filter="todos">Todos</button>
            </div>
            <div class="filter-date-row">
              <label class="filter-date-label" for="filterDate">📅 Fecha específica</label>
              <input type="date" id="filterDate" class="filter-date-input" />
            </div>
          </div>

          <ul class="history-list" id="historyList">
            <li class="history-empty" id="historyEmpty">Sin viajes registrados aún</li>
          </ul>

          <button class="btn-clear-history" id="btnClearHistory" onclick="limpiarHistorial()" style="display:none">
            🗑️ Borrar historial
          </button>
        </div>
      </section>

    </main>

    <footer class="footer">
      <p>Buen viaje 🛣️</p>
    </footer>

  </div>

  <div class="toast" id="toast">¡Copiado!</div>

  <script src="./app.js"></script>
</body>
</html>
